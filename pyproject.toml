[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "TID", "T20"]

# Service code logs only through app.logs (AppLogger, LogFlow, LogScope, LogField).
# logging, print and the internal app.logs modules are for app/logs alone.
# Spans are opened by app.logs and the EDOT distro, so opentelemetry is for app/logs alone too.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"logging".msg = "Log through app.logs (AppLogger, LogFlow, LogScope)"
"opentelemetry".msg = "Trace through app.logs (LogFlow, LogScope, setup_tracing); the EDOT distro sets up the SDK"
"app.logs._fields".msg = "Internal to app.logs; import from app.logs"
"app.logs._flow".msg = "Internal to app.logs; import from app.logs"
"app.logs._format".msg = "Internal to app.logs; import from app.logs"
"app.logs._logger".msg = "Internal to app.logs; import from app.logs"
"app.logs._request".msg = "Internal to app.logs; import from app.logs"
"app.logs._trace".msg = "Internal to app.logs; import from app.logs"

[tool.ruff.lint.per-file-ignores]
"app/logs/**" = ["TID251"]
# Tests read log output and check the logging internals
"tests/**" = ["TID251"]
# Command-line tools that print their reports
"evaluation/**" = ["T20", "TID251"]
